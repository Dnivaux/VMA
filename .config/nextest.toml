[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# Tests that measure real time (missed clock ticks, picture rates, silence detection) run
# alone: on 2-core CI runners, the GStreamer 1080p50 and GPU tests running beside them can
# delay a tick or a picture by more than a frame period.
[[profile.default.overrides]]
filter = 'test(hot_add_and_remove_without_missed_frames) | test(flooding_producer_never_tears_nor_misses) | test(live_test_source_delivers_in_order_at_its_rate) | test(errors_end_of_stream_and_silence_are_losses) | test(lost_pipeline_is_reported_and_reconnected) | test(looping_file_has_no_gap) | test(file_playback_controls) | test(synthetic_source_is_resampled_to_the_master_rate) | test(stalled_output_loses_only_its_own_frames) | test(engine_frames_reach_the_file_with_flash_and_beep_aligned) | test(sync_test_recording_has_its_beeps_on_its_flashes) | test(blocking_sink_loses_only_its_own_frames) | test(three_destinations_stream_at_once) | test(lost_server_reconnects_while_the_recording_runs) | test(sync_analyser_reads_a_live_stream_back) | test(srt_caller_reaches_its_receiver_and_reconnects) | test(srt_listener_waits_for_its_receivers)'
threads-required = "num-test-threads"

# CI only: the same real-time tests get up to 2 retries. The shared runners (Windows above
# all) now and then miss a master tick for reasons outside the test; a retry shows as FLAKY
# in the report (listed in ROADMAP.md), and a test failing 3 times in a row is still a
# failure. No retry on the development machine.
[[profile.ci.overrides]]
filter = 'test(hot_add_and_remove_without_missed_frames) | test(flooding_producer_never_tears_nor_misses) | test(live_test_source_delivers_in_order_at_its_rate) | test(errors_end_of_stream_and_silence_are_losses) | test(lost_pipeline_is_reported_and_reconnected) | test(looping_file_has_no_gap) | test(file_playback_controls) | test(synthetic_source_is_resampled_to_the_master_rate) | test(stalled_output_loses_only_its_own_frames) | test(engine_frames_reach_the_file_with_flash_and_beep_aligned) | test(sync_test_recording_has_its_beeps_on_its_flashes) | test(blocking_sink_loses_only_its_own_frames) | test(three_destinations_stream_at_once) | test(lost_server_reconnects_while_the_recording_runs) | test(sync_analyser_reads_a_live_stream_back) | test(srt_caller_reaches_its_receiver_and_reconnects) | test(srt_listener_waits_for_its_receivers)'
retries = 2
