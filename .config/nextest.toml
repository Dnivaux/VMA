[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# Tests that measure real time (missed clock ticks, picture rates, silence detection) run
# alone: on 2-core CI runners, the GStreamer 1080p50 and GPU tests running beside them can
# delay a tick or a picture by more than a frame period. The overlay test (GPU, end to end)
# is no real-time test but loads WARP enough to starve the others (CI Windows, 2026-11-09);
# the stinger test (GPU, end to end) likewise. Phase 6: the recorders (live sources recorded
# picture by picture) and the replay player (a picture on each tick).
[[profile.default.overrides]]
filter = 'test(hot_add_and_remove_without_missed_frames) | test(loading_a_project_costs_no_frame) | test(flooding_producer_never_tears_nor_misses) | test(live_test_source_delivers_in_order_at_its_rate) | test(errors_end_of_stream_and_silence_are_losses) | test(lost_pipeline_is_reported_and_reconnected) | test(looping_file_has_no_gap) | test(file_playback_controls) | test(synthetic_source_is_resampled_to_the_master_rate) | test(stalled_output_loses_only_its_own_frames) | test(engine_frames_reach_the_file_with_flash_and_beep_aligned) | test(sync_test_recording_has_its_beeps_on_its_flashes) | test(blocking_sink_loses_only_its_own_frames) | test(three_destinations_stream_at_once) | test(lost_server_reconnects_while_the_recording_runs) | test(sync_analyser_reads_a_live_stream_back) | test(srt_caller_reaches_its_receiver_and_reconnects) | test(srt_listener_waits_for_its_receivers) | test(the_pipeline_clock_is_the_master_clock) | test(live_pictures_carry_their_stream_time) | test(file_sound_reaches_its_ring_on_the_time_of_the_pictures) | test(the_beep_reaches_the_ring_on_the_time_of_its_flash) | test(lip_sync_) | test(early_sound_is_measured_early) | test(drifting_sources_stay_in_sync_for_a_minute) | test(a_delayed_input_is_back_in_sync) | test(a_recording_carries_its_bus) | test(a_microphone_is_heard_lost_and_found_again) | test(the_headphones_play_the_ring_on_their_device) | test(a_microphone_and_the_headphones_through_the_engine) | test(srt_input_listens_and_reconnects) | test(srt_input_receives_our_srt_output_in_sync) | test(an_ndi_source_is_found_received_lost_and_found_again) | test(our_ndi_output_reaches_an_ndi_input_in_sync) | test(overlays_are_keyed_over_the_program_under_the_ftb) | test(a_full_screen_shows_the_multiview) | test(a_stinger_plays_picture_by_picture_and_cuts_at_its_tick) | test(a_stinger_file_is_preloaded_played_in_order_and_again) | test(an_input_is_recorded_all_intra) | test(the_iso_is_an_mkv_with_its_sound) | test(an_input_is_recorded_for_the_replay_and_as_iso_through_the_commands) | test(the_player_plays_the_recorded_pictures_at_its_speed) | test(another_angle_goes_on_from_the_same_moment) | test(an_event_plays_in_replay_a) | test(mark_then_rejouer_goes_to_the_replay_and_back) | test(a_replay_at_full_speed_has_the_sound_of_its_angle)'
threads-required = "num-test-threads"

# CI only: the same real-time tests get up to 2 retries. The shared runners (Windows above
# all) now and then miss a master tick for reasons outside the test; a retry shows as FLAKY
# in the report (listed in ROADMAP.md), and a test failing 3 times in a row is still a
# failure. No retry on the development machine.
[[profile.ci.overrides]]
filter = 'test(hot_add_and_remove_without_missed_frames) | test(loading_a_project_costs_no_frame) | test(flooding_producer_never_tears_nor_misses) | test(live_test_source_delivers_in_order_at_its_rate) | test(errors_end_of_stream_and_silence_are_losses) | test(lost_pipeline_is_reported_and_reconnected) | test(looping_file_has_no_gap) | test(file_playback_controls) | test(synthetic_source_is_resampled_to_the_master_rate) | test(stalled_output_loses_only_its_own_frames) | test(engine_frames_reach_the_file_with_flash_and_beep_aligned) | test(sync_test_recording_has_its_beeps_on_its_flashes) | test(blocking_sink_loses_only_its_own_frames) | test(three_destinations_stream_at_once) | test(lost_server_reconnects_while_the_recording_runs) | test(sync_analyser_reads_a_live_stream_back) | test(srt_caller_reaches_its_receiver_and_reconnects) | test(srt_listener_waits_for_its_receivers) | test(the_pipeline_clock_is_the_master_clock) | test(live_pictures_carry_their_stream_time) | test(file_sound_reaches_its_ring_on_the_time_of_the_pictures) | test(the_beep_reaches_the_ring_on_the_time_of_its_flash) | test(lip_sync_) | test(early_sound_is_measured_early) | test(drifting_sources_stay_in_sync_for_a_minute) | test(a_delayed_input_is_back_in_sync) | test(a_recording_carries_its_bus) | test(a_microphone_is_heard_lost_and_found_again) | test(the_headphones_play_the_ring_on_their_device) | test(a_microphone_and_the_headphones_through_the_engine) | test(srt_input_listens_and_reconnects) | test(srt_input_receives_our_srt_output_in_sync) | test(an_ndi_source_is_found_received_lost_and_found_again) | test(our_ndi_output_reaches_an_ndi_input_in_sync) | test(overlays_are_keyed_over_the_program_under_the_ftb) | test(a_full_screen_shows_the_multiview) | test(a_stinger_plays_picture_by_picture_and_cuts_at_its_tick) | test(a_stinger_file_is_preloaded_played_in_order_and_again) | test(an_input_is_recorded_all_intra) | test(the_iso_is_an_mkv_with_its_sound) | test(an_input_is_recorded_for_the_replay_and_as_iso_through_the_commands) | test(the_player_plays_the_recorded_pictures_at_its_speed) | test(another_angle_goes_on_from_the_same_moment) | test(an_event_plays_in_replay_a) | test(mark_then_rejouer_goes_to_the_replay_and_back) | test(a_replay_at_full_speed_has_the_sound_of_its_angle)'
retries = 2
