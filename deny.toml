# cargo-deny policy — enforces rule 2.6 of BRIEF.md (no GPL in the binary).
# Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Not vulnerabilities: these crates were merged into zbus 6 and flagged "unmaintained".
    # Pulled in by eframe -> egui-winit -> accesskit (Linux screen-reader support).
    # Remove once accesskit moves to zbus 6. Reviewed 2026-10-26.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; transitive via accesskit" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; transitive via accesskit" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; transitive via accesskit" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. Anything else (GPL, LGPL, AGPL, SSPL, unknown…) fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]
exceptions = [
    # egui's embedded default fonts (Ubuntu-Light, Hack, emoji). Font licences that allow
    # bundling with software of any licence; not copyleft on the program itself.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # NDI® plugin of gst-plugins-rs (ADR 0008 § 5): MPL-2.0, copyleft limited to its own files,
    # used unmodified from crates.io. This crate only.
    { crate = "gst-plugin-ndi", allow = ["MPL-2.0"] },
    # Build-time only, never in a binary: `download-cef` (build script of cef-dll-sys, feature
    # `cef` of vma-io-html, ADR 0009) fetches the CEF archive over TLS and unpacks it.
    # Permissive licences: bzip2's own BSD-like licence; CDLA-Permissive-2.0 for the Mozilla
    # root certificates (data).
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
