name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # GStreamer for Windows (ADR 0004): official MSVC installers, runtime + development.
  GST_WIN_VERSION: "1.26.11"
  GST_WIN_RUNTIME_SHA256: 31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605
  GST_WIN_DEVEL_SHA256: af0a0720692052aaf5fb0cf2847ef34a87016ef0f914328d516f049e6c86f587
  # openh264enc (CI H.264 fallback, ADR 0006 § 6) built from the gst-plugins-bad sources of
  # the runner's GStreamer: Ubuntu packages libopenh264 (BSD-2) but not the plugin.
  GST_BAD_VERSION: "1.24.2"
  GST_BAD_SHA256: 448e32787bc82b586c6cb2f81c9a8ef404fea4f77f25566fe06e597a3f59136b
  # RTMP test server (MIT, ADR 0006): downloaded, checked, run by the tests, never linked.
  MEDIAMTX_VERSION: "v1.21.2"
  MEDIAMTX_LINUX_SHA256: 121be6e00397e473a95d83c75f4fcd3819a6af3b0e1a50889cba43ab4fab6a27

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The `vma-html` helper's graph too (feature `cef`, off by default; ADR 0009).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --features vma-io-html/cef

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.95 check --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GPU on hosted runners: software adapters (lavapipe / WARP).
          # Ubuntu pinned: the openh264 plugin is built from the gst-plugins-bad sources of
          # the runner's GStreamer (1.24.2 on 24.04); `ubuntu-latest` moves to 26.04.
          - os: ubuntu-24.04
            wgpu_backend: vulkan
          - os: windows-latest
            wgpu_backend: dx12
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies (lavapipe, windowing headers, GStreamer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-tools libopenh264-dev
      - name: Cache GStreamer installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: gst-installers
          key: gstreamer-msvc-x86_64-${{ env.GST_WIN_VERSION }}
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GST_WIN_VERSION
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc"
          New-Item -ItemType Directory -Force gst-installers | Out-Null
          $files = @{
            "gstreamer-1.0-msvc-x86_64-$v.msi" = $env:GST_WIN_RUNTIME_SHA256
            "gstreamer-1.0-devel-msvc-x86_64-$v.msi" = $env:GST_WIN_DEVEL_SHA256
          }
          foreach ($name in $files.Keys) {
            $path = "gst-installers\$name"
            if (-not (Test-Path $path)) { Invoke-WebRequest "$base/$name" -OutFile $path }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $files[$name]) { throw "checksum mismatch for $name" }
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$path`" /qn /norestart ADDLOCAL=ALL"
            if ($p.ExitCode -ne 0) { throw "msiexec $name failed: $($p.ExitCode)" }
          }
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $root) {
            $root = @('C:\Program Files\gstreamer\1.0\msvc_x86_64', 'C:\gstreamer\1.0\msvc_x86_64') |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $root) { throw "GStreamer install directory not found" }
          $root = $root.TrimEnd('\')
          Write-Host "GStreamer in $root"
          # GStreamer's own pkg-config first (gstreamer-rs README).
          "$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the openh264 plugin (Linux; Ubuntu does not package it)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          v=$(pkg-config --modversion gstreamer-1.0)
          test "$v" = "$GST_BAD_VERSION" || { echo "GStreamer $v: update GST_BAD_VERSION / SHA-256"; exit 1; }
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-$v.tar.xz"
          echo "$GST_BAD_SHA256  gst-plugins-bad-$v.tar.xz" | sha256sum -c -
          tar -xJf "gst-plugins-bad-$v.tar.xz" "gst-plugins-bad-$v/ext/openh264"
          cd "gst-plugins-bad-$v/ext/openh264"
          printf '%s\n' "#define PACKAGE \"gst-plugins-bad\"" "#define VERSION \"$v\"" \
            '#define GST_PACKAGE_NAME "GStreamer Bad Plug-ins (CI build)"' \
            '#define GST_PACKAGE_ORIGIN "https://gstreamer.freedesktop.org"' \
            '#define GST_LICENSE "LGPL"' '#define GST_API_VERSION "1.0"' > config.h
          flags=$(pkg-config --cflags gstreamer-video-1.0 gstreamer-pbutils-1.0 openh264)
          gcc -c -fPIC -O2 -DHAVE_CONFIG_H -I. $flags gstopenh264plugin.c
          g++ -c -fPIC -O2 -DHAVE_CONFIG_H -I. $flags gstopenh264enc.cpp gstopenh264dec.cpp
          mkdir -p "$RUNNER_TEMP/gst-plugins"
          g++ -shared -o "$RUNNER_TEMP/gst-plugins/libgstopenh264.so" ./*.o \
            $(pkg-config --libs gstreamer-video-1.0 gstreamer-pbutils-1.0 openh264)
          # Loads it now: a missing symbol or library fails here, with the reason.
          GST_DEBUG=GST_PLUGIN_LOADING:4 gst-inspect-1.0 "$RUNNER_TEMP/gst-plugins/libgstopenh264.so" | head -20
          echo "GST_PLUGIN_PATH=$RUNNER_TEMP/gst-plugins" >> "$GITHUB_ENV"
      - name: MediaMTX (Linux; RTMP tests, B7)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediamtx" && cd "$RUNNER_TEMP/mediamtx"
          f="mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/bluenviron/mediamtx/releases/download/$MEDIAMTX_VERSION/$f"
          echo "$MEDIAMTX_LINUX_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" mediamtx
          ./mediamtx --version
          # Required: the streaming tests fail instead of being skipped if it goes missing.
          echo "VMA_MEDIAMTX=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"
          echo "VMA_REQUIRE_MEDIAMTX=1" >> "$GITHUB_ENV"
      - name: Output elements present (encoders, muxers, RTMP, SRT)
        shell: bash
        run: |
          for e in openh264enc avenc_aac matroskamux mp4mux flvmux rtmp2sink rtmp2src \
              mpegtsmux tsdemux srtsink srtsrc; do
            gst-inspect-1.0 --exists "$e" && echo "$e: ok" || { echo "$e: missing"; exit 1; }
          done
          # Present on both runners: the SRT tests (B8) must run, not be skipped.
          echo "VMA_REQUIRE_SRT=1" >> "$GITHUB_ENV"
      - name: Decoders with alpha present (WebM alpha, ProRes, QuickTime Animation, PNG)
        shell: bash
        run: |
          for e in vp8alphadecodebin vp9alphadecodebin avdec_prores avdec_qtrle avdec_png; do
            gst-inspect-1.0 --exists "$e" && echo "$e: ok" || { echo "$e: missing"; exit 1; }
          done
          # The alpha files test (Phase 4, D3) must run, not skip a clip.
          echo "VMA_REQUIRE_ALPHA_DECODERS=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Upload golden-frame diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: tests/golden/*.actual.png
          if-no-files-found: ignore

  # CEF helper `vma-html` (ADR 0009, Phase 4 step 4): built apart, it downloads CEF. Runs the
  # trial probe: off-screen rendering without a display, alpha, one image per begin-frame.
  html:
    name: html (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Where cef-dll-sys downloads CEF, kept by the cache below (`runner` has no job-level env).
      - name: CEF location
        shell: bash
        run: echo "CEF_PATH=${{ runner.temp }}/cef" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Registry only: target/ would hold a copy of CEF (hundreds of MB).
      - uses: Swatinem/rust-cache@v2
        with:
          key: html
          cache-targets: false
      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-${{ runner.os }}-
      - name: Build vma-html
        run: cargo build --release --locked -p vma-io-html --features cef --bin vma-html
      - name: Trim the CEF cache (archive, debug symbols of libcef.so)
        if: steps.cache-cef.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find "$CEF_PATH" -name '*.tar.bz2' -delete
          if [ "$RUNNER_OS" = Linux ]; then
            find "$CEF_PATH" -name libcef.so -exec strip --strip-unneeded {} \;
          fi
          du -sh "$CEF_PATH"
      - name: Clippy (vma-html)
        run: cargo clippy --locked -p vma-io-html --features cef --all-targets -- -D warnings
      # D12: Chromium's licence notices ship next to vma-html.
      - name: Licence notices next to vma-html
        shell: bash
        run: test -s target/release/CREDITS.html
      - name: Libraries of vma-html found (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd target/release/vma-html | tee ldd.txt
          ! grep "not found" ldd.txt
      # Steady state, required on both OS.
      - name: CEF trial probe after a 5 s warm-up (1080p50, 60 s, no display)
        shell: bash
        run: |
          set -o pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/vma-html --vma-probe --vma-seconds=60 \
            --vma-warmup=250 2> probe-long-stderr.txt | tee probe-long.md
          cat probe-long.md >> "$GITHUB_STEP_SUMMARY"
      # Startup (0.5 s warm-up). Windows: one burst of ticks without image in the browser's
      # first ~3 s (renderer stalled 140–255 ms, ADR 0009): reported, not blocking, until the
      # Windows tests the maintainer deferred to the end of the project (ROADMAP ⏸).
      - name: CEF trial probe (1080p50, 20 s, no display)
        if: always()
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -o pipefail
          # No display server, as on a machine without screen: rendering is off-screen.
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/vma-html --vma-probe --vma-seconds=20 \
            2> probe-stderr.txt | tee probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"
      # D4 and D7 with the real helper: HtmlHost launches vma-html like the application does.
      - name: HTML input tests with the real vma-html
        if: always()
        shell: bash
        env:
          VMA_HTML: ${{ github.workspace }}/target/release/vma-html${{ runner.os == 'Windows' && '.exe' || '' }}
          VMA_REQUIRE_HTML: "1"
        run: cargo test --release --locked -p vma-io-html --test real_helper -- --nocapture
      # D4 / D7 with the real engine (Linux): GStreamer to build vma-io, lavapipe for the GPU.
      - name: Install GStreamer and lavapipe (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base
      - name: HTML input in overlay with the real engine and vma-html, D5 (Linux)
        if: always() && runner.os == 'Linux'
        env:
          VMA_HTML: ${{ github.workspace }}/target/release/vma-html
          VMA_REQUIRE_HTML: "1"
          WGPU_BACKEND: vulkan
        run: |
          cargo test --release --locked -p vma-io-gst --test html -- --nocapture --test-threads=1
          # D5 at 59.94 too (20 s).
          VMA_D5_RATE=60000/1001 VMA_D5_SECS=20 \
            cargo test --release --locked -p vma-io-gst --test html an_animated -- --nocapture
      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-probe-${{ matrix.os }}
          path: |
            probe*.md
            probe*-stderr.txt
          if-no-files-found: ignore
