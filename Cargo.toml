[workspace]
resolver = "3"
members = [
    "app",
    "crates/core",
    "crates/clock",
    "crates/engine",
    "crates/compositor",
    "crates/io-gst",
    "crates/io-ndi",
    "crates/io-html",
    "crates/audio",
    "crates/replay",
    "crates/api",
    "crates/ui",
]
default-members = ["app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dnivaux/VMA"
publish = false

[workspace.dependencies]
# Internal crates
vma-core = { path = "crates/core" }
vma-clock = { path = "crates/clock" }
vma-engine = { path = "crates/engine" }
vma-compositor = { path = "crates/compositor" }
vma-ui = { path = "crates/ui" }
vma-io-gst = { path = "crates/io-gst" }
vma-audio = { path = "crates/audio" }
vma-io-ndi = { path = "crates/io-ndi" }
vma-io-html = { path = "crates/io-html" }

# External crates — licence noted for each (rule 2.6). Enforced by deny.toml.
wgpu = "30.0"                                                # MIT OR Apache-2.0
egui = "0.37"                                                # MIT OR Apache-2.0
eframe = { version = "0.37", default-features = false }      # MIT OR Apache-2.0
egui-wgpu = "0.37"                                           # MIT OR Apache-2.0
# Lucide icons of the UI (ADR 0011): crate MIT, icon artwork ISC (Feather-derived subset MIT).
egui-lucide = "0.2"                                          # MIT AND ISC
# SVG loader the icons are drawn with (resvg: Apache-2.0 OR MIT); no text, no raster images.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] } # MIT OR Apache-2.0
# Already under eframe; used directly to run its event loop and list the screens.
winit = { version = "0.30", default-features = false }       # Apache-2.0
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] } # MIT OR Apache-2.0 (tests only; wgpu + snapshot: headless screenshots, dify MIT, image MIT OR Apache-2.0, open MIT, tempfile MIT OR Apache-2.0)
crossbeam-channel = "0.5"                                    # MIT OR Apache-2.0
arc-swap = "1.9"                                             # MIT OR Apache-2.0
thiserror = "2.0"                                            # MIT OR Apache-2.0
anyhow = "1"                                                 # MIT OR Apache-2.0
tracing = "0.1"                                              # MIT
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # MIT
tracing-appender = "0.2"                                     # MIT
bytemuck = { version = "1.25", features = ["derive"] }       # MIT OR Apache-2.0 OR Zlib
pollster = "1.0"                                             # MIT OR Apache-2.0
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] } # MIT OR Apache-2.0 (PNG: png, MIT OR Apache-2.0 ; JPEG: zune-jpeg, MIT OR Apache-2.0 OR Zlib)
gstreamer = "0.25"                                           # MIT OR Apache-2.0 (bindings ; GStreamer lui-même LGPL-2.1+, lié dynamiquement, ADR 0004)
gstreamer-app = "0.25"                                       # MIT OR Apache-2.0
gstreamer-video = "0.25"                                     # MIT OR Apache-2.0
# NDI® plugin of gst-plugins-rs, registered statically (ADR 0008): loads the NDI runtime at run
# time (never linked nor shipped). Exception in deny.toml for this crate only.
gst-plugin-ndi = "0.15.4"                                    # MPL-2.0
serde = { version = "1.0", features = ["derive"] }           # MIT OR Apache-2.0
serde_json = "1.0"                                           # MIT OR Apache-2.0
rfd = "0.17"                                                 # MIT (sélecteur de fichier natif ; Linux : portail XDG via zbus, pas de GTK ; Windows : API Win32)
# Off-screen HTML input (ADR 0009), only in the `vma-html` helper (feature `cef` of vma-io-html,
# never in `vma`). Pinned: each version is one CEF / Chromium build. Its build script downloads a
# public CEF build (BSD-3-Clause ; Chromium : licences de ses composants, avis à livrer).
cef = { version = "=156.4.0", default-features = false }     # Apache-2.0 OR MIT
memmap2 = "0.9"                                              # MIT OR Apache-2.0 (mémoire partagée de l'input HTML)

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Rule 2.4: no unwrap / expect / panic in live paths. Tests are allowed via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (wgpu, naga, egui) are painfully slow unoptimised.
opt-level = 2

[profile.dev.package.vma-audio]
# DSP run per sample: its tests play an hour of simulated sound (C3 of phase-3.md).
opt-level = 2
